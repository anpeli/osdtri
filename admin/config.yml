backend:
  name: git-gateway
  branch: main
  squash_merges: true

media_folder: "assets/images"
public_folder: "/assets/images"

identity:
  service: netlify

collections:
  - name: "about"
    label: "About"
    files:
      - file: "src/content/pages/about.md"
        label: "About"
        name: "about"
        fields:
          - { name: "title", label: "Title" }
          - { name: "slug", label: "Slug" }
          - { name: "backdrop", label: "Page header backdrop", widget: "image", required: false }
          - { name: "body", label: "Body", widget: "markdown" }

  - name: "membership"
    label: "Membership"
    files:
      - file: "src/content/pages/membership.md"
        label: "Membership"
        name: "membership"
        fields:
          - { name: "title", label: "Title" }
          - { name: "slug", label: "Slug" }
          - { name: "backdrop", label: "Page header backdrop", widget: "image", required: false }
          - { name: "body", label: "Body", widget: "markdown" }

  - name: "training"
    label: "Training"
    files:
      - file: "src/content/pages/training.md"
        label: "Training"
        name: "training"
        fields:
          - { name: "title", label: "Title" }
          - { name: "slug", label: "Slug" }
          - { name: "backdrop", label: "Page header backdrop", widget: "image", required: false }
          - { name: "body", label: "Body", widget: "markdown" }

  - name: "contact"
    label: "Contact"
    files:
      - file: "src/content/pages/contact.md"
        label: "Contact"
        name: "contact"
        fields:
          - { name: "title", label: "Title" }
          - { name: "slug", label: "Slug" }
          - { name: "backdrop", label: "Page header backdrop", widget: "image", required: false }
          - { name: "styrelse", label: "Styrelse", widget: "markdown" }
          - { name: "social", label: "Email/Facebook/Instagram", widget: "markdown" }

  - name: "events-page"
    label: "Events page"
    files:
      - file: "src/content/pages/events.md"
        label: "Events page"
        name: "events-page"
        fields:
          - { name: "title", label: "Title" }
          - { name: "slug", label: "Slug" }
          - { name: "backdrop", label: "Page header backdrop", widget: "image", required: false }
          - { name: "body", label: "Body", widget: "markdown" }

  - name: "events"
    label: "Events"
    folder: "src/content/events"
    create: true
    identifier_field: "title"
    summary: "{{date | date('YYYY-MM-DD')}} — {{title}}"
    fields:
      - { name: "title", label: "Title" }
      - { name: "date", label: "Date", widget: "datetime" }
      - { name: "location", label: "Location", required: false }
      - { name: "facebookUrl", label: "Facebook URL", required: false }
      - { name: "description", label: "Description", widget: "markdown" }
      - { name: "image", label: "Image", widget: "image", required: false }

  - name: "posts"
    label: "Posts"
    folder: "src/content/posts"
    create: true
    fields:
      - { name: "title", label: "Title" }
      - { name: "date", label: "Date", widget: "datetime" }
      - { name: "author", label: "Author" }
      - { name: "image", label: "Image", widget: "image", required: false }
      - { name: "body", label: "Body", widget: "markdown" }
