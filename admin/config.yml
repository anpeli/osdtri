backend:
  name: git-gateway
  branch: main
  squash_merges: true

local_backend: true

media_folder: "assets/images"
public_folder: "/assets/images"

identity:
  service: netlify

collections:

  - name: "pages"
    label: "Pages"
    files:
      - file: "src/content/pages/home.md"
        label: "Home"
        name: "home"
        fields:
          - { name: "title", label: "Title" }
          - { name: "backdrop", label: "Desktop page header backdrop", widget: "image", required: false }
          - { name: "backdropSmall", label: "Mobile page header backdrop", widget: "image", required: false }
          - { name: "backdropPosition", label: "Desktop page header backdrop position", widget: "string", required: false, hint: "CSS position, for example center 33%" }
          - { name: "backdropSmallPosition", label: "Mobile page header backdrop position", widget: "string", required: false, hint: "CSS position, for example center 33%" }
          - { name: "body", label: "Body", widget: "markdown", modes: ["raw", "rich_text"], required: false }
      - file: "src/content/pages/events.md"
        label: "Events"
        name: "events"
        fields:
          - { name: "title", label: "Title" }
          - { name: "backdrop", label: "Desktop page header backdrop", widget: "image", required: false }
          - { name: "backdropSmall", label: "Mobile page header backdrop", widget: "image", required: false }
          - { name: "backdropPosition", label: "Desktop page header backdrop position", widget: "string", required: false, hint: "CSS position, for example center 33%" }
          - { name: "backdropSmallPosition", label: "Mobile page header backdrop position", widget: "string", required: false, hint: "CSS position, for example center 33%" }
          - { name: "body", label: "Body", widget: "markdown", modes: ["raw", "rich_text"], required: false }
      - file: "src/content/pages/gallery.md"
        label: "Gallery"
        name: "gallery"
        fields:
          - { name: "title", label: "Title" }
          - { name: "backdrop", label: "Desktop page header backdrop", widget: "image", required: false }
          - { name: "backdropSmall", label: "Mobile page header backdrop", widget: "image", required: false }
          - { name: "backdropPosition", label: "Desktop page header backdrop position", widget: "string", required: false, hint: "CSS position, for example center 33%" }
          - { name: "backdropSmallPosition", label: "Mobile page header backdrop position", widget: "string", required: false, hint: "CSS position, for example center 33%" }
          - { name: "body", label: "Body", widget: "markdown", modes: ["raw", "rich_text"], required: false }
      - file: "src/content/pages/about.md"
        label: "About"
        name: "about"
        fields:
          - { name: "title", label: "Title" }
          - { name: "backdrop", label: "Desktop page header backdrop", widget: "image", required: false }
          - { name: "backdropSmall", label: "Mobile page header backdrop", widget: "image", required: false }
          - { name: "backdropPosition", label: "Desktop page header backdrop position", widget: "string", required: false, hint: "CSS position, for example center 33%" }
          - { name: "backdropSmallPosition", label: "Mobile page header backdrop position", widget: "string", required: false, hint: "CSS position, for example center 33%" }
          - { name: "body", label: "Body", widget: "markdown", modes: ["raw", "rich_text"], required: false }
      - file: "src/content/pages/membership.md"
        label: "Membership"
        name: "membership"
        fields:
          - { name: "title", label: "Title" }
          - { name: "backdrop", label: "Desktop page header backdrop", widget: "image", required: false }
          - { name: "backdropSmall", label: "Mobile page header backdrop", widget: "image", required: false }
          - { name: "backdropPosition", label: "Desktop page header backdrop position", widget: "string", required: false, hint: "CSS position, for example center 33%" }
          - { name: "backdropSmallPosition", label: "Mobile page header backdrop position", widget: "string", required: false, hint: "CSS position, for example center 33%" }
          - { name: "body", label: "Body", widget: "markdown", modes: ["raw", "rich_text"], required: false }
      - file: "src/content/pages/training.md"
        label: "Training"
        name: "training"
        fields:
          - { name: "title", label: "Title" }
          - { name: "backdrop", label: "Desktop page header backdrop", widget: "image", required: false }
          - { name: "backdropSmall", label: "Mobile page header backdrop", widget: "image", required: false }
          - { name: "backdropPosition", label: "Desktop page header backdrop position", widget: "string", required: false, hint: "CSS position, for example center 33%" }
          - { name: "backdropSmallPosition", label: "Mobile page header backdrop position", widget: "string", required: false, hint: "CSS position, for example center 33%" }
          - { name: "body", label: "Body", widget: "markdown", modes: ["raw", "rich_text"], required: false }
      - file: "src/content/pages/partners.md"
        label: "Partners"
        name: "partners"
        fields:
          - { name: "title", label: "Title" }
          - { name: "backdrop", label: "Desktop page header backdrop", widget: "image", required: false }
          - { name: "backdropSmall", label: "Mobile page header backdrop", widget: "image", required: false }
          - { name: "backdropPosition", label: "Desktop page header backdrop position", widget: "string", required: false, hint: "CSS position, for example center 33%" }
          - { name: "backdropSmallPosition", label: "Mobile page header backdrop position", widget: "string", required: false, hint: "CSS position, for example center 33%" }
          - { name: "body", label: "Body", widget: "markdown", modes: ["raw", "rich_text"], required: false }
      - file: "src/content/pages/archive.md"
        label: "Archive"
        name: "archive"
        fields:
          - { name: "title", label: "Title" }
          - { name: "backdrop", label: "Desktop page header backdrop", widget: "image", required: false }
          - { name: "backdropSmall", label: "Mobile page header backdrop", widget: "image", required: false }
          - { name: "backdropPosition", label: "Desktop page header backdrop position", widget: "string", required: false, hint: "CSS position, for example center 33%" }
          - { name: "backdropSmallPosition", label: "Mobile page header backdrop position", widget: "string", required: false, hint: "CSS position, for example center 33%" }
          - { name: "body", label: "Body", widget: "markdown", modes: ["raw", "rich_text"], required: false }
      - file: "src/content/pages/post.md"
        label: "Post"
        name: "post"
        fields:
          - { name: "title", label: "Title" }
          - { name: "backdrop", label: "Desktop page header backdrop", widget: "image", required: false }
          - { name: "backdropSmall", label: "Mobile page header backdrop", widget: "image", required: false }
          - { name: "backdropPosition", label: "Desktop page header backdrop position", widget: "string", required: false, hint: "CSS position, for example center 33%" }
          - { name: "backdropSmallPosition", label: "Mobile page header backdrop position", widget: "string", required: false, hint: "CSS position, for example center 33%" }
      - file: "src/content/pages/event.md"
        label: "Event"
        name: "event"
        fields:
          - { name: "title", label: "Title" }
          - { name: "backdrop", label: "Desktop page header backdrop", widget: "image", required: false }
          - { name: "backdropSmall", label: "Mobile page header backdrop", widget: "image", required: false }
          - { name: "backdropPosition", label: "Desktop page header backdrop position", widget: "string", required: false, hint: "CSS position, for example center 33%" }
          - { name: "backdropSmallPosition", label: "Mobile page header backdrop position", widget: "string", required: false, hint: "CSS position, for example center 33%" }
          - { name: "body", label: "Body", widget: "markdown", modes: ["raw", "rich_text"], required: false }

  - name: "events"
    label: "Events"
    folder: "src/content/events"
    create: true
    identifier_field: "title"
    summary: "{{date | date('YYYY-MM-DD')}} - {{title}}"
    fields:
      - { name: "title", label: "Title" }
      - { name: "date", label: "Date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false }
      - name: "eventType"
        label: "Event type"
        widget: "select"
        options:
          - { label: "Internal", value: "internal" }
          - { label: "External", value: "external" }
        default: "internal"
      - { name: "author", label: "Author", required: false }
      - { name: "time", label: "Time", widget: "string", required: false, pattern: ["^([01]\\d|2[0-3]):[0-5]\\d$", "Enter a time in 24-hour format (HH:MM)"] }
      - { name: "duration", label: "Expected duration", widget: "string", required: false, hint: "Include the unit, e.g. 1 timme or 1,5 timmar." }
      - { name: "location", label: "Location", required: false }
      - { name: "URL", label: "URL", widget: "string", required: false }
      - name: "participants"
        label: "Participants"
        widget: "list"
        required: false
        field: { name: "participant", label: "Name", widget: "string" }
      - { name: "body", label: "Description", widget: "markdown" }

  - name: "posts"
    label: "Posts"
    folder: "src/content/posts"
    create: true
    identifier_field: "title"
    summary: "{{date | date('YYYY-MM-DD')}} - {{title}}"
    fields:
      - { name: "title", label: "Title" }
      - { name: "date", label: "Date", widget: "datetime" }
      - { name: "author", label: "Author" }
      - { name: "body", label: "Body", widget: "markdown", modes: ["raw", "rich_text"] }

  - name: "galleries"
    label: "Galleries"
    folder: "src/content/galleries"
    create: true
    identifier_field: "title"
    summary: "{{title}}"
    fields:
      - { name: "title", label: "Title" }
      - { name: "date", label: "Date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false }
      - { name: "photographer", label: "Photographer" }
      - { name: "body", label: "Body", widget: "markdown", required: false }
      - name: "images"
        label: "Images"
        widget: "list"
        required: false
        field: { name: "image", label: "Image", widget: "image" }

  - name: "site-settings"
    label: "Site settings"
    files:
      - file: "src/content/settings/site.md"
        label: "Site settings"
        name: "site"
        fields:
          - { name: "formSubmitToken", label: "FormSubmit token", widget: "string", hint: "Use the token from FormSubmit, then activate it from the email FormSubmit sends." }
          - { name: "email", label: "Email", widget: "string", pattern: ["^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$", "Enter a valid email address"] }
          - { name: "facebookUrl", label: "Facebook URL", widget: "string", required: false }
          - { name: "instagramUrl", label: "Instagram URL", widget: "string", required: false }
          - { name: "backdrop", label: "Default desktop page header backdrop", widget: "image" }
          - { name: "backdropSmall", label: "Default mobile page header backdrop", widget: "image", required: false }
          - { name: "backdropPosition", label: "Default desktop page header backdrop position", widget: "string", required: false, hint: "CSS position, for example center 33%" }
          - { name: "backdropSmallPosition", label: "Default mobile page header backdrop position", widget: "string", required: false, hint: "CSS position, for example center 33%" }
