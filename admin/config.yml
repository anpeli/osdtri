backend:
  name: git-gateway
  branch: main
  squash_merges: true

local_backend: true

media_folder: "assets/images"
public_folder: "/assets/images"

identity:
  service: netlify

collections:
  - name: "posts"
    label: "Home"
    label_singular: "Post"
    folder: "src/content/posts"
    create: true
    identifier_field: "title"
    summary: "{{date | date('YYYY-MM-DD')}} - {{title}}"
    fields:
      - { name: "title", label: "Title" }
      - { name: "date", label: "Date", widget: "datetime" }
      - { name: "author", label: "Author" }
      - { name: "body", label: "Body", widget: "markdown", modes: ["raw", "rich_text"] }

  - name: "pages"
    label: "Pages"
    files:
      - file: "src/content/pages/about.md"
        label: "About"
        name: "about"
        fields:
          - { name: "body", label: "Body", widget: "markdown", modes: ["raw", "rich_text"] }
      - file: "src/content/pages/membership.md"
        label: "Membership"
        name: "membership"
        fields:
          - { name: "body", label: "Body", widget: "markdown", modes: ["raw", "rich_text"] }
      - file: "src/content/pages/partners.md"
        label: "Partners"
        name: "partners"
        fields:
          - { name: "body", label: "Body", widget: "markdown", modes: ["raw", "rich_text"] }
      - file: "src/content/pages/training.md"
        label: "Training"
        name: "training"
        fields:
          - { name: "body", label: "Body", widget: "markdown", modes: ["raw", "rich_text"] }

  - name: "events"
    label: "Events"
    label_singular: "Event"
    folder: "src/content/events"
    create: true
    identifier_field: "title"
    summary: "{{date | date('YYYY-MM-DD')}} - {{title}}"
    fields:
      - { name: "title", label: "Title" }
      - { name: "date", label: "Date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false }
      - name: "eventType"
        label: "Event type"
        widget: "select"
        options:
          - { label: "Internal", value: "internal" }
          - { label: "External", value: "external" }
        default: "internal"
      - { name: "author", label: "Author", required: false }
      - { name: "time", label: "Time", widget: "string", required: false, pattern: ["^([01]\\d|2[0-3]):[0-5]\\d$", "Enter a time in 24-hour format (HH:MM)"] }
      - { name: "duration", label: "Expected duration", widget: "string", required: false, hint: "Include the unit, e.g. 1 timme or 1,5 timmar." }
      - { name: "location", label: "Location", required: false }
      - { name: "URL", label: "URL", widget: "string", required: false }
      - name: "participants"
        label: "Participants"
        widget: "list"
        label_singular: "Participant"
        required: false
        field: { name: "participant", label: "Full name", widget: "string" }
      - { name: "body", label: "Description", widget: "markdown" }

  - name: "galleries"
    label: "Galleries"
    label_singular: "Gallery"
    folder: "src/content/galleries"
    create: true
    identifier_field: "title"
    summary: "{{title}}"
    fields:
      - { name: "title", label: "Title" }
      - { name: "date", label: "Date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false }
      - { name: "body", label: "Body", widget: "markdown", required: false }
      - name: "images"
        label: "Images"
        widget: "list"
        label_singular: "Image"
        required: false
        field: { name: "image", label: "Image", widget: "image" }

  - name: "documents"
    label: "Documents"
    label_singular: "Document"
    folder: "src/content/documents"
    create: true
    extension: "md"
    identifier_field: "title"
    summary: "{{title}}"
    media_folder: "src/content/documents"
    public_folder: "/src/content/documents"
    fields:
      - { name: "title", label: "Title" }
      - { name: "document", label: "Document", widget: "file", required: true }

  - name: "page-settings"
    label: "Settings"
    files:
      - file: "src/content/settings/about.md"
        label: "About"
        name: "about"
        fields:
          - { name: "title", label: "Title", required: true }
          - { name: "backdrop", label: "Desktop page header backdrop", widget: "image", required: true }
          - { name: "backdropSmall", label: "Mobile page header backdrop", widget: "image", required: false }
          - { name: "backdropPosition", label: "Desktop page header backdrop position", widget: "string", required: false, hint: "CSS position, for example center 33%" }
          - { name: "backdropSmallPosition", label: "Mobile page header backdrop position", widget: "string", required: false, hint: "CSS position, for example center 33%" }
      - file: "src/content/settings/archive.md"
        label: "Archive"
        name: "archive"
        fields:
          - { name: "title", label: "Title", required: true }
          - { name: "backdrop", label: "Desktop page header backdrop", widget: "image", required: true }
          - { name: "backdropSmall", label: "Mobile page header backdrop", widget: "image", required: false }
          - { name: "backdropPosition", label: "Desktop page header backdrop position", widget: "string", required: false, hint: "CSS position, for example center 33%" }
          - { name: "backdropSmallPosition", label: "Mobile page header backdrop position", widget: "string", required: false, hint: "CSS position, for example center 33%" }
      - file: "src/content/settings/contact-form.md"
        label: "Contact form"
        name: "contact-form"
        fields:
          - { name: "formSubmitToken", label: "FormSubmit token", widget: "string", required: false, hint: "Use the token from FormSubmit, then activate it from the email FormSubmit sends." }
          - { name: "email", label: "Fallback and contact email", widget: "string", required: true, pattern: ["^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$", "Enter a valid email address"] }
      - file: "src/content/settings/dokument.md"
        label: "Dokument"
        name: "dokument"
        fields:
          - { name: "title", label: "Title", required: true }
          - { name: "backdrop", label: "Desktop page header backdrop", widget: "image", required: true }
          - { name: "backdropSmall", label: "Mobile page header backdrop", widget: "image", required: false }
          - { name: "backdropPosition", label: "Desktop page header backdrop position", widget: "string", required: false, hint: "CSS position, for example center 33%" }
          - { name: "backdropSmallPosition", label: "Mobile page header backdrop position", widget: "string", required: false, hint: "CSS position, for example center 33%" }
      - file: "src/content/settings/event.md"
        label: "Event"
        name: "event"
        fields:
          - { name: "title", label: "Title", required: true }
          - { name: "backdrop", label: "Desktop page header backdrop", widget: "image", required: true }
          - { name: "backdropSmall", label: "Mobile page header backdrop", widget: "image", required: false }
          - { name: "backdropPosition", label: "Desktop page header backdrop position", widget: "string", required: false, hint: "CSS position, for example center 33%" }
          - { name: "backdropSmallPosition", label: "Mobile page header backdrop position", widget: "string", required: false, hint: "CSS position, for example center 33%" }
      - file: "src/content/settings/events.md"
